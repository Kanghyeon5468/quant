name: quantcore
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    environment:
      QUANTCORE_MODE: demo
      QUANTCORE_API_USERS_JSON: ${QUANTCORE_API_USERS_JSON:-}
      QUANTCORE_API_TOKEN: ${QUANTCORE_API_TOKEN:-}
      QUANTCORE_ALLOWED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    ports: ["127.0.0.1:8100:8000"]
    volumes: ["research-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      QUANTCORE_WEB_SIGN_IN: ${QUANTCORE_WEB_SIGN_IN:-false}
      QUANTCORE_API_TOKEN: ${QUANTCORE_API_TOKEN:-}
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  research-data:
