[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcore"
version = "0.1.0"
description = "Deterministic financial research modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "wsproto>=1.2,<2", "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3", "numpy>=1.26,<2.4", "pandas>=2.2,<3",
  "scipy>=1.14,<2", "pyarrow>=18,<24", "duckdb>=1.1,<2",
  "scikit-learn>=1.5,<2", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.9,<1", "mypy>=1.13,<2", "playwright>=1.49,<2"]
notebook = ["ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "matplotlib>=3.9,<4", "ipywidgets>=8.1,<9", "jinja2>=3.1,<4"]
realdata = ["exchange-calendars>=4.8,<5", "python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["quantcore*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/QuantCore_Backtest.ipynb" = ["E402", "F704"]  # Path bootstrap and Jupyter top-level await.
"notebooks/QuantCore_Real_Stocks_Backtest.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["quantcore", "apps.api"]
omit = ["*/__init__.py"]
